name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laravel:
    name: Laravel (tests + Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, intl, zip, pdo_sqlite, pcntl
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  face-service:
    name: Service IA (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: face-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sh scripts/download_models.sh
      - run: pytest -q
