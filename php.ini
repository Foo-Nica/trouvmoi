; Réglages PHP de production (utilisés par Railway / Railpack, sans effet en local).
; Photos jusqu'à 25 Mo et traitement d'images en mémoire.
memory_limit = 1024M
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 300
max_input_time = 300
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
